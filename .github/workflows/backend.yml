# .github/workflows/core-services.yml
name: Backend

on:
  pull_request:
    paths:
      - "backend/**"

  push:
    branches: [main]
    paths:
      - "backend/**"

env:
  JAVA_VERSION: "21"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build
        run: mvn clean verify -DskipITs=true -DskipTests

      - name: Upload Jacoco
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: backend/**/target/site/jacoco
          if-no-files-found: warn

  docker:
    name: Build & Publish Docker Images
    runs-on: ubuntu-latest
    needs: build

    # Publication uniquement après un push sur main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        service:
          - profile-service
          - eligibility-service
          - application-service
          - document-service
          - security-service
          - notification-service
          - consent-service
          - document-extraction-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: backend/core-services/${{ matrix.service }}
          file: backend/core-services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
