server:
  port: 7081

spring:
    application:
        name: connector-service

    threads:
        virtual:
            enabled: true

    data:
        redis:
            host: localhost
            port: 6379


minio:
    enabled: true


kafka:
    enabled: true


connectors:

    # Configuration commune HTTP
    connect-timeout: 2s

    read-timeout: 10s

    retry:
        max-attempts: 3
        delay: 1000

    scheduler:
        enabled: true
        fixed-delay: PT1H

    # Authentification par défaut du service
    # NONE pour les sources publiques
    authentication: NONE

    security:
        api-key:
            enabled: false
            header-name: X-API-Key
            value: ${CONNECTOR_API_KEY:}

        oauth2:
            enabled: false
            token-uri: ${OAUTH2_TOKEN_URI:}
            client-id: ${OAUTH2_CLIENT_ID:}
            client-secret: ${OAUTH2_CLIENT_SECRET:}
            scope: openid


    #
    # DataGouv Connector
    #
    datagouv:
        enabled: true
        base-url: https://www.data.gouv.fr
        query: aides publiques
        territory-code: FR
        limit: 20


    #
    # Régions
    #
    region:
        enabled: true

        territories:
            - HDF
            - IDF
            - PACA


    #
    # Départements
    #
    department:
        enabled: true

        territories:
            - 59
            - 62
            - 75


    #
    # Préfectures
    #
    prefecture:
        enabled: true


    #
    # CAF
    #
    caf:
        enabled: true

        base-url: https://www.caf.fr

        territory-code: FR

        limit: 20

        documents:

            # Guide des prestations CAF 2026
            - https://www.caf.fr/sites/default/files/medias/141/Actualites/2026/Guide%20des%20prestation%202026_page%20simple.pdf

            # Allocations familiales
            - https://www.caf.fr/professionnels/offres-et-services/accompagnement-des-allocataires/bareme-allocations-familiales

            # Prime d'activité
            - https://www.caf.fr/professionnels/offres-et-services/accompagnement-des-allocataires/bareme-prime-d-activite

            # Complément familial
            - https://www.caf.fr/professionnels/offres-et-services/accompagnement-des-allocataires/bareme-complement-familial

            # RSA
            - https://www.caf.fr/professionnels/offres-et-services/accompagnement-des-allocataires/bareme-revenu-de-solidarite-active

            # Prime à la naissance / allocation de base
            - https://www.caf.fr/professionnels/offres-et-services/accompagnement-des-allocataires/bareme-prime-la-naissance-et-allocation-de-base

            # Évolution Prime d'activité 2026
            - https://www.caf.fr/allocataires/actualites/actualites-nationales/la-prime-d-activite-augmente-en-2026

            # Questions / réponses Prime d'activité 2026
            - https://www.caf.fr/allocataires/actualites/actualites-nationales/les-reponses-vos-questions-sur-levolution-de-la-prime-d-activite-2026

            # Allocation de soutien familial
            - https://www.caf.fr/professionnels/offres-et-services/accompagnement-des-allocataires/bareme-allocation-de-soutien-familial

            # Index accompagnement des allocataires
            - https://www.caf.fr/professionnels/offres-et-services/accompagnement-des-allocataires


messaging:
    kafka:
        bootstrap-servers: ${KAFKA_BRK:localhost:9092}

        schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8091/apis/ccompat/v7}

        group-id: connector-service-v1

        auto-offset-reset: earliest


storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}

    access-key: ${STORAGE_ACCESS_KEY:admin}

    secret-key: ${STORAGE_SECRET_KEY:admin123456}


#
# Actuator / Observabilité
#
management:
    endpoints:
        web:
            exposure:
                include:
                    - health
                    - info
                    - prometheus

    endpoint:
        health:
            show-details: always


#
# Logging
#
logging:
    level:
        root: INFO

        com.govtech.connectors: DEBUG

        org.springframework.kafka: INFO