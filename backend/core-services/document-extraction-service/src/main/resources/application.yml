server:
    port: 9085

spring:
    application:
        name: document-extraction-service


    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/extractiondb}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:postgres}

    flyway:
      baseline-on-migrate: true
      locations: classpath:db/migration

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true

      properties:
        hibernate:
          format_sql: true

ocr:
    provider: paddle
    base-url: ${OCR_BASE_URL:http://localhost:8000}

minio:
    enabled: true

kafka:
    enabled: true

storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:admin}
    secret-key: ${STORAGE_SECRET_KEY:admin123456}

messaging:
    kafka:
        bootstrap-servers: ${KAFKA_BRK:localhost:9092}
        schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8091/apis/ccompat/v7}
        group-id: document-extraction-service-v9

        dlt:
          replay:
            enabled: true
            fixed-delay: 30000
            batch-size: 100
            consumer-group: document-extraction-service-dlt-replay
            topic-pattern: ".*\\.DLT"
            max-replays: 3
    outbox:
      enabled: true
      fixed-delay: 5s
      batch-size: 100
      publishing-timeout: 30s
      stale-after: 5m

security:
    jwt:
        secret: ${JWT_SECRET:my-super-secret-key-for-local-development-at-least-48-chars-long}

extraction:
    csv:
        charset: UTF-8
        delimiter: ";"

logging:
    level:
        com.govtech.documentextra: DEBUG
        org.springframework.kafka.listener: INFO
