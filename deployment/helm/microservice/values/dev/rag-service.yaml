nameOverride: rag-service
fullnameOverride: rag-service

replicaCount: 1

image:
  repository: ghcr.io/dso2530/rag-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

container:
  port: 9087
  portName: http

service:
  port: 9087

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  - name: SPRING_PROFILES_ACTIVE
    value: kubernetes
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: "health,info,prometheus"
  - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
    value: "true"
env:
  - name: SPRING_PROFILES_ACTIVE
    value: kubernetes
  - name: MESSAGING_KAFKA_BOOTSTRAP_SERVERS
    value: kafka:29092
  - name: MESSAGING_KAFKA_SCHEMA_REGISTRY_URL
    value: http://apicurio:8080/apis/registry/v3
  - name: OLLAMA_BASE_URL
    value: http://ollama:11434
  - name: PGVECTOR_HOST
    value: pgvector
  - name: PGVECTOR_PORT
    value: "5432"
  - name: PGVECTOR_DATABASE
    value: aidb
