nameOverride: connector-service
fullnameOverride: connector-service

replicaCount: 1

image:
  repository: ghcr.io/dso2530/connector-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

container:
  port: 8080
  portName: http

service:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  - name: SPRING_PROFILES_ACTIVE
    value: kubernetes
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: "health,info,prometheus"
  - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
    value: "true"
