apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: public-benefits-root
  namespace: argocd
spec:
  project: public-benefits
  source:
    repoURL: https://github.com/dso2530/ai-public-benefits-platform.git
    targetRevision: main
    path: deployment/argocd/applications
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true